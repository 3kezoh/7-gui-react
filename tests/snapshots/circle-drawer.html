<DocumentFragment>
  <div
    class="border w-max relative"
    data-testid="circleDrawer"

      class="flex gap-2 p-2 mx-auto w-fit"
    >
      <button
        class="border px-2 cursor-not-allowed bg-gray-200 text-gray-400 border-gray-400"
        disabled=""
        type="button"
      >
        Undo
      </button>
      <button
        class="border px-2 cursor-not-allowed bg-gray-200 text-gray-400 border-gray-400"
        disabled=""
        type="button"
      >
        Redo
      </button>

    <canvas
      height="300"
      width="300"
    >
      This feature is not supported by your browser
    </canvas>
    <button
      class="border bg-white p-2"
      popover="manual"
      type="button"

      Adjust diameter..
    </button>

      Adjust diamater of circle at (, )
      <input
        max="100"
